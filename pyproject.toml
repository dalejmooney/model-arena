[project]
name = "model-arena"
version = "0.1.0"
description = "Run one prompt across every model at once and compare the answers, tokens and real cost."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dale Mooney" }]
keywords = ["llm", "anthropic", "openai", "gemini", "groq", "benchmark", "cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]

[project.urls]
Repository = "https://github.com/dalejmooney/model-arena"
Findings = "https://github.com/dalejmooney/model-arena/blob/main/FINDINGS.md"

[project.scripts]
model-arena = "model_arena.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pip>=26.2",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "uv>=0.12.1",
]

# ---- tooling ----------------------------------------------------------------
# All three tools read this one file. That is the modern convention and it is
# why pyproject.toml replaced setup.cfg, .flake8, mypy.ini, pytest.ini and friends.

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Ruff bundles what used to be five separate tools. Each code is a rule family:
#   E  pycodestyle   style errors (the old flake8 core)
#   F  pyflakes      real mistakes: unused imports, undefined names
#   I  isort         import ordering, so diffs stop arguing about it
#   UP pyupgrade     rewrites old syntax for our target Python
#   B  bugbear       bug-shaped patterns, e.g. mutable default arguments
#   SIM flake8-simplify   needlessly convoluted code
#   ANN flake8-annotations requires type hints, which is what makes mypy useful
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
